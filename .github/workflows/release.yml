name: Core Release Orchestrator

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to orchestrate release for"
        required: true
        type: string
      expected_platforms:
        description: "Comma-separated expected platforms before auto-publish"
        required: false
        default: "ios,android"
        type: string

permissions:
  contents: read

concurrency:
  group: release-core-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-core:
    name: Validate, Draft Release & Dispatch Downstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag, commit, and tag worktree
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_EXPECTED_PLATFORMS: ${{ inputs.expected_platforms }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import re
          import subprocess
          import tempfile

          event_name = os.environ["EVENT_NAME"]
          raw_tag = (
              os.environ["INPUT_TAG"]
              if event_name == "workflow_dispatch"
              else os.environ["REF_NAME"]
          ).strip()

          tag_re = re.compile(
              r"^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$"
          )
          if not tag_re.match(raw_tag):
              raise SystemExit(f"ERROR: invalid release tag {raw_tag!r}")

          proc = subprocess.run(
              ["git", "rev-list", "-n", "1", f"refs/tags/{raw_tag}"],
              capture_output=True,
              text=True,
              check=False,
          )
          tag_commit = proc.stdout.strip() if proc.returncode == 0 else ""
          if not re.fullmatch(r"[0-9a-fA-F]{40}", tag_commit):
              raise SystemExit(
                  f"ERROR: failed to resolve 40-hex commit for refs/tags/{raw_tag}: {proc.stderr.strip()}"
              )
          tag_commit = tag_commit.lower()

          raw_expected = os.environ.get("INPUT_EXPECTED_PLATFORMS", "").strip() or "ios,android"
          expected_list: list[str] = []
          for item in raw_expected.split(","):
              plat = item.strip().lower()
              if not plat:
                  continue
              if not re.fullmatch(r"[a-z0-9]+", plat):
                  raise SystemExit(f"ERROR: invalid platform name {plat!r}")
              if plat not in expected_list:
                  expected_list.append(plat)
          if not expected_list:
              raise SystemExit("ERROR: expected_platforms must not be empty")

          runner_temp = os.environ.get("RUNNER_TEMP") or tempfile.gettempdir()
          worktree = tempfile.mkdtemp(prefix="tag-worktree.", dir=runner_temp)
          wt_proc = subprocess.run(
              ["git", "worktree", "add", "--detach", worktree, f"refs/tags/{raw_tag}"],
              capture_output=True,
              text=True,
              check=False,
          )
          if wt_proc.returncode != 0:
              raise SystemExit(
                  f"ERROR: git worktree add failed for {raw_tag}: {wt_proc.stderr.strip()}"
              )

          print(f"tag={raw_tag}")
          print(f"tag_commit={tag_commit}")
          print(f"worktree={worktree}")
          print(f"expected_platforms_csv={','.join(expected_list)}")
          print(f"expected_platforms_json={json.dumps(expected_list)}")
          PY

      - name: Verify Git tag matches Cargo.toml version
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          TAG_WORKTREE: ${{ steps.resolve.outputs.worktree }}
        run: |
          python3 scripts/build-release-manifest.py \
            --repo-root "${TAG_WORKTREE}" \
            --verify-tag "${RELEASE_TAG}"

      - name: Verify spec-lock integrity
        env:
          TAG_WORKTREE: ${{ steps.resolve.outputs.worktree }}
        run: |
          set -euo pipefail
          python3 scripts/verify-spec-lock.py
          if [ -f "${TAG_WORKTREE}/scripts/verify-spec-lock.py" ]; then
            python3 "${TAG_WORKTREE}/scripts/verify-spec-lock.py"
          fi

      - name: Self-test release scripts
        env:
          TAG_WORKTREE: ${{ steps.resolve.outputs.worktree }}
        run: |
          set -euo pipefail
          python3 scripts/build-release-manifest.py --self-test --repo-root "${TAG_WORKTREE}"
          python3 scripts/release_finalize.py --self-test --repo-root "${TAG_WORKTREE}"

      - name: Build initial release-manifest.json
        id: manifest
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          TAG_COMMIT: ${{ steps.resolve.outputs.tag_commit }}
          TAG_WORKTREE: ${{ steps.resolve.outputs.worktree }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/build-release-manifest.py \
            --repo-root "${TAG_WORKTREE}" \
            --tag "${RELEASE_TAG}" \
            --git-commit "${TAG_COMMIT}" \
            --output dist/release-manifest.json \
            --write-checksums dist/SHA256SUMS.txt
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json, pathlib
          data = json.loads(pathlib.Path("dist/release-manifest.json").read_text(encoding="utf-8"))
          print(f"version={data['coreVersion']}")
          print(f"abi_version={data['abiVersion']}")
          print(f"session_proto={data['protocolVersions']['session']}")
          print(f"punch_proto={data['protocolVersions']['punch']}")
          print(f"beacon_proto={data['protocolVersions']['beacon']}")
          PY

      - name: Ensure Draft GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          TAG_COMMIT: ${{ steps.resolve.outputs.tag_commit }}
        run: |
          set -euo pipefail
          python3 scripts/release_finalize.py \
            --ensure-draft-release \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --target-commitish "${TAG_COMMIT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload initial release-manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 scripts/release_finalize.py \
            --upload-assets \
            --repo "${GITHUB_REPOSITORY}" \
            --release-id "${RELEASE_ID}" \
            --file dist/release-manifest.json

      - name: Generate GitHub App dispatch token
        id: app-token
        if: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: TokenBoom
          repositories: |
            rabbitcontrol-apple-media
            rabbitcontrol-android

      - name: Dispatch downstream platform builds
        env:
          DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
          HAS_APP_ID: ${{ secrets.RELEASE_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
          CORE_TAG: ${{ steps.resolve.outputs.tag }}
          CORE_VERSION: ${{ steps.manifest.outputs.version }}
          CORE_COMMIT: ${{ steps.resolve.outputs.tag_commit }}
          CORE_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          CORE_ABI_VERSION: ${{ steps.manifest.outputs.abi_version }}
          CORE_SESSION_PROTO: ${{ steps.manifest.outputs.session_proto }}
          CORE_PUNCH_PROTO: ${{ steps.manifest.outputs.punch_proto }}
          CORE_BEACON_PROTO: ${{ steps.manifest.outputs.beacon_proto }}
          EXPECTED_PLATFORMS_JSON: ${{ steps.resolve.outputs.expected_platforms_json }}
        run: |
          set -euo pipefail
          if [ "${HAS_APP_ID}" != "${HAS_APP_KEY}" ]; then
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must both be configured."
            exit 1
          fi
          if [ -z "${DISPATCH_TOKEN}" ]; then
            if [ "${HAS_APP_ID}" = "true" ]; then
              echo "::error::GitHub App dispatch token generation yielded an empty token."
              exit 1
            fi
            echo "::warning::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are not configured; skipping repository_dispatch for downstream platform repos. Draft Release was still prepared."
            exit 0
          fi

          PAYLOAD="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "event_type": "rabbitcontrol-core-release",
              "client_payload": {
                  "tag": os.environ["CORE_TAG"],
                  "version": os.environ["CORE_VERSION"],
                  "commit": os.environ["CORE_COMMIT"],
                  "release_id": int(os.environ["CORE_RELEASE_ID"]),
                  "abi_version": int(os.environ["CORE_ABI_VERSION"]),
                  "protocol_versions": {
                      "session": int(os.environ["CORE_SESSION_PROTO"]),
                      "punch": int(os.environ["CORE_PUNCH_PROTO"]),
                      "beacon": int(os.environ["CORE_BEACON_PROTO"]),
                  },
                  "core_repo": os.environ["GITHUB_REPOSITORY"],
                  "expected_platforms": json.loads(os.environ["EXPECTED_PLATFORMS_JSON"]),
              },
          }))
          PY
          )"

          FAILED=0
          for TARGET_REPO in \
            "TokenBoom/rabbitcontrol-apple-media" \
            "TokenBoom/rabbitcontrol-android"; do
            echo "Dispatching rabbitcontrol-core-release to ${TARGET_REPO}..."
            RESP_FILE="$(mktemp)"
            if ! HTTP_CODE="$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "${RESP_FILE}" -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
              -d "${PAYLOAD}")"; then
              echo "::error::repository_dispatch to ${TARGET_REPO} failed due to network/curl error."
              rm -f "${RESP_FILE}"
              FAILED=1
              continue
            fi
            if [ "${HTTP_CODE}" != "204" ]; then
              echo "::error::repository_dispatch to ${TARGET_REPO} returned HTTP ${HTTP_CODE}: $(cat "${RESP_FILE}")"
              FAILED=1
            else
              echo "Dispatched rabbitcontrol-core-release to ${TARGET_REPO} (HTTP 204)."
            fi
            rm -f "${RESP_FILE}"
          done

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Cleanup tag worktree
        if: always() && steps.resolve.outputs.worktree != ''
        env:
          TAG_WORKTREE: ${{ steps.resolve.outputs.worktree }}
        run: |
          if [ -n "${TAG_WORKTREE}" ] && [ -e "${TAG_WORKTREE}" ]; then
            git worktree remove --force "${TAG_WORKTREE}" || rm -rf "${TAG_WORKTREE}"
          fi
