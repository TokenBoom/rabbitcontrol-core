[package]
name = "rc-client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RabbitControl 跨平台客户端核心运行时（认证/PKI、信令/P2P/mTLS 中继、主控与被控会话桥接、偏好设置与工具句柄）。"

[dependencies]
rc-session = { path = "../rc-session" }
rc-net = { path = "../rc-net" }
rc-input = { path = "../rc-input" }
rc-types = { path = "../rc-types" }
rc-proto = { path = "../rc-proto" }
rc-pipeline = { path = "../rc-pipeline" }
rc-capture = { path = "../rc-capture" }
rc-encode = { path = "../rc-encode" }
rc-render = { path = "../rc-render" }
rc-decode = { path = "../rc-decode" }
rc-trace = { path = "../rc-trace" }
rc-audio = { path = "../rc-audio" }
rc-tools = { path = "../rc-tools" }
rand = "0.8"
socket2 = { version = "0.6.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
